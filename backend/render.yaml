services:
     - type: web
       name: tutoriapp-tokens
       env: python
       rootDir: backend
       buildCommand: pip install -r requirements.txt
       startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
       envVars:
         - key: LIVEKIT_URL
           sync: false
         - key: LIVEKIT_API_KEY
           sync: false
         - key: LIVEKIT_API_SECRET
           sync: false
         - key: INTERNAL_API_KEY
           sync: false